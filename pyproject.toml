[project]
name = "corpus-mcp"
version = "0.1.2"
description = "MCP Server for Corpus Tracker - Financial Portfolio Assistant"
authors = [
    { name = "Mathan Karthik", email = "mathanbe18@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
keywords = ["mcp", "corpus-tracker", "finance", "mcp-server"]

[project.urls]
Homepage = "https://github.com/Mathankarthik18/corpus-mcp"
Repository = "https://github.com/Mathankarthik18/corpus-mcp"
Documentation = "https://github.com/Mathankarthik18/corpus-mcp#readme"

[project.scripts]
corpus-mcp = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
